# Real demonstrations for offline BC; random/cluttered task for online RL.
bench_name: RoboDojo
data_task: stack_blocks
rollout_task: stack_blocks_random
eval_task: stack_blocks_random
env_cfg: arx_x5
action_type: ee
seed: 0
camera_names:
  - cam_head
data_path: data/RoboDojo/stack_blocks/arx_x5
max_episodes: 0
val_fraction: 0.1
# Diffusion: Transformer denoiser over ImageNet ResNet18 spatial tokens.
pretrained_backbone: true
backbone: resnet18
backbone_lr: 0.00001
device: auto
policy_gpu: 0
env_gpu: 1
width: 256
heads: 8
layers: 8
dropout: 0.1
augment: true
latent_dim: 32
image_size:
  - 240
  - 320
# Official Diffusion Policy uses two observation frames (velocity cues).
# frame_dropout randomly keeps only the current frame during training.
obs_steps: 2
frame_dropout: 0.1
# Receding-horizon execution: predict a chunk, execute a shorter prefix.
chunk: 16
execute_steps: 8
# Train with the official 100-step schedule; DDIM evaluates a 16-step subset
# with eta=0 so evaluation does not pay 100 network passes per control step.
diffusion_steps: 100
inference_steps: 16
# Min-SNR-gamma loss weighting (arXiv:2303.09556); 0 disables it.
min_snr_gamma: 5.0
epochs: 100
batch_size: 16
workers: 0
learning_rate: 0.0001
weight_decay: 0.0001
kl_weight: 0.01
ema_decay: 0.999
lr_schedule: cosine
lr_warmup_epochs: 2
lr_min_ratio: 0.05
max_grad_norm: 1.0
save_every: 10
# Must set to your own offline checkpoint before the online stage.
offline_checkpoint: null
resume: null
env_backend: remote
env_launch: docker
# RoboDojo reloads saved layouts; it does not generate scenes at reset time.
# random = saved random-task layout bank, eval = fixed eval bank.
layout_source: random
# Keep training layouts disjoint from formal eval (eval.yaml defaults to 0).
layout_seed: 1
sim_image: stack-blocks-sim:isaacsim5.1
num_envs: 1
allow_shared_gpu: false
env_host: 127.0.0.1
env_port: 5555
env_timeout: 2400
reset_timeout: 10800
domain_randomization: false
finetune_updates: 100
finetune_episodes: 4
max_decisions_per_episode: 550
gamma: 0.99
gae_lambda: 0.95
ppo_epochs: 4
ppo_batch_size: 32
ppo_clip: 0.2
value_clip: 0.2
actor_lr: 0.00001
critic_lr: 0.0001
target_kl: 0.03
entropy_coef: 0.0
# Value head shares the frozen diffusion prefix encoder.
critic_shared: true
# Freeze the large ImageNet trunk while PPO trains the denoising suffix. The
# optimizer still owns every parameter, so old optimizer states load unchanged.
freeze_online_backbone: true
# Optional L2 anchor of the updated suffix to the frozen prefix (0 disables).
suffix_l2: 0.0
residual_scale: 0.1
residual_std: 0.3
finetune_denoising_steps: 4
denoising_min_std: 0.05
denoising_gamma: 0.99
