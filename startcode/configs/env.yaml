# Real demonstrations for offline BC; random/cluttered task for online RL.
bench_name: RoboDojo
data_task: stack_blocks
rollout_task: stack_blocks_random
eval_task: stack_blocks_random
env_cfg: arx_x5
action_type: ee
seed: 0
camera_names:
  - cam_head
data_path: data/RoboDojo/stack_blocks/arx_x5
max_episodes: 0
val_fraction: 0.1
# Policy model and offline optimizer. No pretrained downloads.
device: auto
policy_gpu: 0
env_gpu: 1
width: 128
heads: 4
layers: 2
latent_dim: 32
image_size: 96
chunk: 10
execute_steps: 4
diffusion_steps: 20
epochs: 100
batch_size: 32
workers: 0
learning_rate: 0.0001
weight_decay: 0.0001
kl_weight: 0.01
ema_decay: 0.995
max_grad_norm: 1.0
save_every: 10
# Must set to your own offline checkpoint before the online stage.
offline_checkpoint: null
resume: null
env_backend: remote
env_launch: docker
sim_image: stack-blocks-sim:isaacsim5.1
num_envs: 1
allow_shared_gpu: false
env_host: 127.0.0.1
env_port: 5555
env_timeout: 2400
reset_timeout: 10800
domain_randomization: false
finetune_updates: 100
finetune_episodes: 4
max_decisions_per_episode: 550
gamma: 0.99
gae_lambda: 0.95
ppo_epochs: 4
ppo_batch_size: 32
ppo_clip: 0.2
actor_lr: 0.00001
critic_lr: 0.0001
target_kl: 0.03
entropy_coef: 0.0
residual_scale: 0.1
residual_std: 0.3
finetune_denoising_steps: 4
denoising_min_std: 0.05
denoising_gamma: 0.99
