# 评测只固定任务、动作和镜像侧的卡。checkpoint 与策略环境名由你填写。
task: stack_blocks_random
env_cfg: arx_x5
action_type: ee
seed: 0
# native 使用任务配置里的条数。要少评就改成整数。
eval_num: native
policy_gpu: 0
env_gpu: 1
# 你自己创建的 conda 环境名。没有策略镜像。
policy_env: student
# 由 scripts/bootstrap_third_party.sh 生成的适配器目录。
# policies/diffusion 只有服务端脚本，RoboDojo 客户端还需要 deploy.py / client 脚本。
policy_dir: third_party/XPolicyLab/policy/StudentDiffusion
ckpt: student-checkpoint
