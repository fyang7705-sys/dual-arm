# 宿主机直跑评测（scripts/eval_host.sh）：Isaac Sim 用本地 conda 环境，
# 不需要 docker 镜像。configs/eval.yaml 保持原样给 scripts/eval_policy.sh 用。
task: stack_blocks
env_cfg: arx_x5
action_type: ee
seed: 0
# native 用任务配置里的条数；要少评就改成整数，例如 1。
eval_num: native

# 策略进程和 Isaac 必须用不同的卡。
policy_gpu: 0
env_gpu: 1

# 策略服务用的 conda 环境，以及 Isaac 客户端用的 conda 环境。
policy_env: robodojo
sim_env: robodojo

# 服务端：bootstrap 生成的 StudentACT 适配器转发到本仓库的 ACT 服务。
# ckpt 可以是 latest、outputs/act 下的目录/文件名，或 .ckpt 的绝对路径。
policy_dir: third_party/XPolicyLab/policy/StudentACT
ckpt: latest

# 客户端：RoboDojo 按目录名 import XPolicyLab.policy.<名字>.deploy。
# StudentACT 里安装的是本仓库的 eval_deploy.py。
client_policy_dir: third_party/XPolicyLab/policy/StudentACT
